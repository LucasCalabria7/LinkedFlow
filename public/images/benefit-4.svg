<svg width="200" height="200" viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="200" height="200" rx="20" fill="#F0F9FF"/>
  
  <!-- Chart background -->
  <rect x="40" y="60" width="120" height="80" rx="8" fill="#0077B5" opacity="0.1"/>
  
  <!-- Chart grid lines -->
  <line x1="40" y1="80" x2="160" y2="80" stroke="#0077B5" stroke-width="1" stroke-dasharray="4 4" opacity="0.3"/>
  <line x1="40" y1="100" x2="160" y2="100" stroke="#0077B5" stroke-width="1" stroke-dasharray="4 4" opacity="0.3"/>
  <line x1="40" y1="120" x2="160" y2="120" stroke="#0077B5" stroke-width="1" stroke-dasharray="4 4" opacity="0.3"/>
  
  <!-- Chart bars -->
  <rect x="60" y="110" width="10" height="30" rx="2" fill="#0077B5" opacity="0.4"/>
  <rect x="80" y="90" width="10" height="50" rx="2" fill="#0077B5" opacity="0.6"/>
  <rect x="100" y="70" width="10" height="70" rx="2" fill="#0077B5" opacity="0.8"/>
  <rect x="120" y="80" width="10" height="60" rx="2" fill="#0077B5" opacity="0.6"/>
  <rect x="140" y="100" width="10" height="40" rx="2" fill="#0077B5" opacity="0.4"/>
  
  <!-- Chart line -->
  <path d="M65 110 L85 90 L105 70 L125 80 L145 100" stroke="#0077B5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- Chart dots -->
  <circle cx="65" cy="110" r="4" fill="#0077B5"/>
  <circle cx="85" cy="90" r="4" fill="#0077B5"/>
  <circle cx="105" cy="70" r="4" fill="#0077B5"/>
  <circle cx="125" cy="80" r="4" fill="#0077B5"/>
  <circle cx="145" cy="100" r="4" fill="#0077B5"/>
  
  <!-- Chart labels -->
  <rect x="60" y="145" width="10" height="3" rx="1.5" fill="#0077B5" opacity="0.4"/>
  <rect x="80" y="145" width="10" height="3" rx="1.5" fill="#0077B5" opacity="0.4"/>
  <rect x="100" y="145" width="10" height="3" rx="1.5" fill="#0077B5" opacity="0.4"/>
  <rect x="120" y="145" width="10" height="3" rx="1.5" fill="#0077B5" opacity="0.4"/>
  <rect x="140" y="145" width="10" height="3" rx="1.5" fill="#0077B5" opacity="0.4"/>
  
  <!-- Highlight effect -->
  <circle cx="105" cy="70" r="8" fill="#0077B5" opacity="0.2"/>
  
  <!-- Decorative elements -->
  <circle cx="30" cy="40" r="10" fill="#0077B5" opacity="0.1"/>
  <circle cx="170" cy="160" r="15" fill="#0077B5" opacity="0.1"/>
  
  <!-- Animation hint -->
  <circle cx="105" cy="70" r="10" stroke="#0077B5" stroke-width="1" opacity="0.3">
    <animate attributeName="r" values="10;15;10" dur="2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.3;0.1;0.3" dur="2s" repeatCount="indefinite"/>
  </circle>
</svg>
