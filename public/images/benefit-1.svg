<svg width="200" height="200" viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="200" height="200" rx="20" fill="#F0F9FF"/>
  
  <!-- Brain visualization -->
  <circle cx="100" cy="100" r="60" fill="#0077B5" opacity="0.1"/>
  
  <!-- Brain connections -->
  <path d="M80 70 C90 60, 110 60, 120 70" stroke="#0077B5" stroke-width="2" stroke-linecap="round"/>
  <path d="M70 90 C60 80, 60 120, 70 110" stroke="#0077B5" stroke-width="2" stroke-linecap="round"/>
  <path d="M130 90 C140 80, 140 120, 130 110" stroke="#0077B5" stroke-width="2" stroke-linecap="round"/>
  <path d="M80 130 C90 140, 110 140, 120 130" stroke="#0077B5" stroke-width="2" stroke-linecap="round"/>
  
  <!-- Brain nodes -->
  <circle cx="80" cy="70" r="5" fill="#0077B5" opacity="0.6"/>
  <circle cx="120" cy="70" r="5" fill="#0077B5" opacity="0.6"/>
  <circle cx="70" cy="90" r="5" fill="#0077B5" opacity="0.6"/>
  <circle cx="70" cy="110" r="5" fill="#0077B5" opacity="0.6"/>
  <circle cx="130" cy="90" r="5" fill="#0077B5" opacity="0.6"/>
  <circle cx="130" cy="110" r="5" fill="#0077B5" opacity="0.6"/>
  <circle cx="80" cy="130" r="5" fill="#0077B5" opacity="0.6"/>
  <circle cx="120" cy="130" r="5" fill="#0077B5" opacity="0.6"/>
  
  <!-- Central brain node -->
  <circle cx="100" cy="100" r="15" fill="#0077B5" opacity="0.8"/>
  <circle cx="100" cy="100" r="8" fill="#0077B5"/>
  
  <!-- Connection lines -->
  <path d="M80 70 L100 100 L120 70" stroke="#0077B5" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M70 90 L100 100 L70 110" stroke="#0077B5" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M130 90 L100 100 L130 110" stroke="#0077B5" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M80 130 L100 100 L120 130" stroke="#0077B5" stroke-width="1.5" stroke-linecap="round"/>
  
  <!-- Pulse animation -->
  <circle cx="100" cy="100" r="25" stroke="#0077B5" stroke-width="1" opacity="0.5">
    <animate attributeName="r" values="25;35;25" dur="2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.5;0.1;0.5" dur="2s" repeatCount="indefinite"/>
  </circle>
</svg>
