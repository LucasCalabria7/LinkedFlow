<svg width="800" height="600" viewBox="0 0 800 600" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background Elements -->
  <rect width="800" height="600" rx="20" fill="#F0F9FF" opacity="0.3"/>
  
  <!-- LinkedIn Profile Frame -->
  <rect x="100" y="50" width="600" height="500" rx="12" fill="white" filter="drop-shadow(0px 8px 24px rgba(0, 119, 181, 0.15))"/>
  
  <!-- Profile Header -->
  <rect x="100" y="50" width="600" height="150" rx="12 12 0 0" fill="#0077B5" opacity="0.1"/>
  
  <!-- Profile Picture -->
  <circle cx="200" cy="150" r="70" fill="white" stroke="#0077B5" stroke-width="4"/>
  <circle cx="200" cy="150" r="60" fill="#0077B5" opacity="0.1"/>
  <path d="M200 110 C180 110, 165 125, 165 145 C165 165, 180 180, 200 180 C220 180, 235 165, 235 145 C235 125, 220 110, 200 110" fill="#0077B5" opacity="0.2"/>
  <path d="M200 125 C190 125, 180 135, 180 145 C180 155, 190 165, 200 165 C210 165, 220 155, 220 145 C220 135, 210 125, 200 125" fill="#0077B5" opacity="0.3"/>
  
  <!-- Profile Info -->
  <rect x="300" y="100" width="250" height="25" rx="4" fill="#0077B5" opacity="0.8"/>
  <rect x="300" y="140" width="180" height="15" rx="4" fill="#0077B5" opacity="0.5"/>
  <rect x="300" y="165" width="120" height="15" rx="4" fill="#0077B5" opacity="0.3"/>
  
  <!-- Content Section -->
  <rect x="150" y="240" width="500" height="80" rx="8" fill="#FAFBFC" stroke="#E2E8F0" stroke-width="1"/>
  <rect x="170" y="260" width="300" height="16" rx="4" fill="#0077B5" opacity="0.8"/>
  <rect x="170" y="290" width="250" height="10" rx="4" fill="#94A3B8" opacity="0.6"/>
  
  <!-- Engagement Stats -->
  <rect x="150" y="340" width="500" height="60" rx="8" fill="white" stroke="#E2E8F0" stroke-width="1"/>
  <circle cx="180" cy="370" r="15" fill="#0077B5" opacity="0.1"/>
  <path d="M175 370 L180 375 L185 365" stroke="#0077B5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="210" y="362" width="60" height="16" rx="4" fill="#0077B5" opacity="0.8"/>
  
  <circle cx="310" cy="370" r="15" fill="#0077B5" opacity="0.1"/>
  <path d="M305 370 L310 375 L315 365" stroke="#0077B5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="340" y="362" width="60" height="16" rx="4" fill="#0077B5" opacity="0.8"/>
  
  <circle cx="440" cy="370" r="15" fill="#0077B5" opacity="0.1"/>
  <path d="M435 370 L440 375 L445 365" stroke="#0077B5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="470" y="362" width="60" height="16" rx="4" fill="#0077B5" opacity="0.8"/>
  
  <!-- Analytics Graph -->
  <rect x="150" y="420" width="500" height="100" rx="8" fill="white" stroke="#E2E8F0" stroke-width="1"/>
  <rect x="170" y="440" width="100" height="16" rx="4" fill="#0077B5" opacity="0.8"/>
  
  <!-- Graph -->
  <path d="M170 490 L220 470 L270 480 L320 450 L370 430 L420 440 L470 420 L520 430 L570 410" 
        stroke="#0077B5" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="220" cy="470" r="4" fill="#0077B5"/>
  <circle cx="270" cy="480" r="4" fill="#0077B5"/>
  <circle cx="320" cy="450" r="4" fill="#0077B5"/>
  <circle cx="370" cy="430" r="4" fill="#0077B5"/>
  <circle cx="420" cy="440" r="4" fill="#0077B5"/>
  <circle cx="470" cy="420" r="4" fill="#0077B5"/>
  <circle cx="520" cy="430" r="4" fill="#0077B5"/>
  <circle cx="570" cy="410" r="4" fill="#0077B5"/>
  
  <!-- Floating Elements -->
  <g transform="translate(650, 150)">
    <rect width="100" height="60" rx="8" fill="white" filter="drop-shadow(0px 4px 12px rgba(0, 119, 181, 0.1))" transform="rotate(5)"/>
    <rect x="15" y="15" width="70" height="10" rx="5" fill="#0077B5" opacity="0.7" transform="rotate(5)"/>
    <rect x="15" y="35" width="50" height="10" rx="5" fill="#0077B5" opacity="0.4" transform="rotate(5)"/>
  </g>
  
  <g transform="translate(50, 350)">
    <rect width="100" height="60" rx="8" fill="white" filter="drop-shadow(0px 4px 12px rgba(0, 119, 181, 0.1))" transform="rotate(-5)"/>
    <rect x="15" y="15" width="70" height="10" rx="5" fill="#0077B5" opacity="0.7" transform="rotate(-5)"/>
    <rect x="15" y="35" width="50" height="10" rx="5" fill="#0077B5" opacity="0.4" transform="rotate(-5)"/>
  </g>
  
  <!-- Decorative Elements -->
  <circle cx="700" cy="100" r="30" fill="#0077B5" opacity="0.05"/>
  <circle cx="720" cy="120" r="15" fill="#0077B5" opacity="0.1"/>
  
  <circle cx="100" cy="500" r="30" fill="#0077B5" opacity="0.05"/>
  <circle cx="80" cy="480" r="15" fill="#0077B5" opacity="0.1"/>
  
  <!-- Lock/Unlock Animation -->
  <g transform="translate(400, 300)">
    <circle cx="0" cy="0" r="40" fill="#0077B5" opacity="0.1">
      <animate attributeName="r" values="40;45;40" dur="3s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.1;0.2;0.1" dur="3s" repeatCount="indefinite"/>
    </circle>
    <path d="M-15 0 L15 0 M0 -15 L0 15" stroke="#0077B5" stroke-width="3" stroke-linecap="round">
      <animate attributeName="stroke-width" values="3;4;3" dur="3s" repeatCount="indefinite"/>
    </path>
  </g>
  
  <!-- LinkedIn Connection Lines -->
  <path d="M720 300 C750 320, 780 340, 750 400" stroke="#0077B5" stroke-width="1.5" stroke-dasharray="4 4" opacity="0.6"/>
  <path d="M50 250 C20 300, 30 350, 80 400" stroke="#0077B5" stroke-width="1.5" stroke-dasharray="4 4" opacity="0.6"/>
  
  <!-- Growth Indicators -->
  <g transform="translate(700, 500)">
    <path d="M-20 0 L0 -20 L20 0" stroke="#0077B5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M0 -20 L0 20" stroke="#0077B5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  
  <g transform="translate(100, 100)">
    <path d="M-20 0 L0 -20 L20 0" stroke="#0077B5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M0 -20 L0 20" stroke="#0077B5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  
  <!-- LinkedIn Logo -->
  <g transform="translate(400, 550)">
    <rect width="40" height="40" rx="4" fill="#0077B5"/>
    <path d="M12 16v14M20 16v14M12 12a2 2 0 100-4 2 2 0 000 4zM20 16c0-2 2-4 5-4 4 0 5 3 5 7v7" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
