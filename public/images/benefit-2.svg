<svg width="200" height="200" viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="200" height="200" rx="20" fill="#F0F9FF"/>
  
  <!-- Target background -->
  <circle cx="100" cy="100" r="60" fill="#0077B5" opacity="0.1"/>
  
  <!-- Target rings -->
  <circle cx="100" cy="100" r="50" stroke="#0077B5" stroke-width="2" opacity="0.3"/>
  <circle cx="100" cy="100" r="40" stroke="#0077B5" stroke-width="2" opacity="0.4"/>
  <circle cx="100" cy="100" r="30" stroke="#0077B5" stroke-width="2" opacity="0.5"/>
  <circle cx="100" cy="100" r="20" stroke="#0077B5" stroke-width="2" opacity="0.6"/>
  <circle cx="100" cy="100" r="10" fill="#0077B5" opacity="0.7"/>
  
  <!-- Arrow -->
  <path d="M160 100 L110 100" stroke="#0077B5" stroke-width="2" stroke-linecap="round"/>
  <path d="M110 100 L120 90" stroke="#0077B5" stroke-width="2" stroke-linecap="round"/>
  <path d="M110 100 L120 110" stroke="#0077B5" stroke-width="2" stroke-linecap="round"/>
  
  <!-- Decorative elements -->
  <circle cx="160" cy="100" r="5" fill="#0077B5" opacity="0.6"/>
  <circle cx="100" cy="100" r="3" fill="white"/>
  
  <!-- Pulse animation -->
  <circle cx="100" cy="100" r="65" stroke="#0077B5" stroke-width="1" opacity="0.2">
    <animate attributeName="r" values="65;75;65" dur="3s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.2;0.05;0.2" dur="3s" repeatCount="indefinite"/>
  </circle>
</svg>
