<svg width="200" height="200" viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="200" height="200" rx="20" fill="#F0F9FF"/>
  
  <!-- Control panel background -->
  <rect x="50" y="60" width="100" height="80" rx="8" fill="#0077B5" opacity="0.1"/>
  
  <!-- Sliders -->
  <rect x="60" y="80" width="80" height="6" rx="3" fill="#0077B5" opacity="0.3"/>
  <circle cx="100" cy="83" r="8" fill="#0077B5" opacity="0.8"/>
  
  <rect x="60" y="100" width="80" height="6" rx="3" fill="#0077B5" opacity="0.3"/>
  <circle cx="80" cy="103" r="8" fill="#0077B5" opacity="0.8"/>
  
  <rect x="60" y="120" width="80" height="6" rx="3" fill="#0077B5" opacity="0.3"/>
  <circle cx="120" cy="123" r="8" fill="#0077B5" opacity="0.8"/>
  
  <!-- Control panel labels -->
  <rect x="60" y="70" width="20" height="4" rx="2" fill="#0077B5" opacity="0.6"/>
  <rect x="60" y="90" width="30" height="4" rx="2" fill="#0077B5" opacity="0.6"/>
  <rect x="60" y="110" width="25" height="4" rx="2" fill="#0077B5" opacity="0.6"/>
  
  <!-- Hand cursor -->
  <circle cx="120" cy="123" r="15" fill="#0077B5" opacity="0.2"/>
  <path d="M115 123 L125 123 M120 118 L120 128" stroke="#0077B5" stroke-width="2" stroke-linecap="round"/>
  
  <!-- Decorative elements -->
  <circle cx="40" cy="50" r="10" fill="#0077B5" opacity="0.1"/>
  <circle cx="160" cy="150" r="15" fill="#0077B5" opacity="0.1"/>
  
  <!-- Animation hint -->
  <circle cx="120" cy="123" r="12" stroke="#0077B5" stroke-width="1" opacity="0.5">
    <animate attributeName="r" values="12;18;12" dur="2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.5;0.1;0.5" dur="2s" repeatCount="indefinite"/>
  </circle>
</svg>
